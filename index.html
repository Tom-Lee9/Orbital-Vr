<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Orbital Lounge VR</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #eef3f6; touch-action: none;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; }
  .panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(340px, calc(100vw - 32px));
    max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; padding: 24px; border-radius: 18px; text-align: center;
    background: rgba(10, 14, 28, 0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,0.15); }
  h1 { margin: 0 0 4px; font-size: 28px; font-weight: 600; }
  .sub, .note { opacity: 0.7; font-size: 13px; }
  button, .btn { font: inherit; color: inherit; cursor: pointer; }
  .panel button, .panel .btn { position: relative; display: block; width: 100%; box-sizing: border-box; margin: 10px 0; padding: 14px;
    border-radius: 12px; border: 0; background: rgba(255,255,255,0.14); font-size: 18px; }
  .panel button:first-of-type { background: #e9f1f5; color: #10202a; font-weight: 600; }
  .panel button:disabled { opacity: 0.4; }
  #videoFile { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  label.row { display: block; margin: 14px 0; text-align: left; } label.row span { float: right; opacity: 0.75; }
  input[type=range] { width: 100%; }
  #hud button { position: fixed; z-index: 5; border: 0; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; background: rgba(0,0,0,0.4); }
  #exit { top: 12px; left: 12px; } #mute { top: 12px; right: 12px; } #playBtn { top: 64px; right: 12px; }
  #hud #walk { width: auto; height: auto; border-radius: 40px; padding: 18px 26px; font-size: 17px; bottom: 24px; right: 24px; }
  body.vr #walk { display: none; }
  body.vr #hud button:not(#walk) { width: 32px; height: 32px; font-size: 14px; opacity: 0.6; top: 12px; }
  body.vr #exit { left: calc(50% - 76px); } body.vr #mute { right: calc(50% - 76px); } body.vr #playBtn { right: auto; left: calc(50% + 6px); }
  #divider { display: none; position: fixed; z-index: 4; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #000; }
  body.vr #divider { display: block; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #000; align-items: center; justify-content: center; padding: 32px; font-size: 20px; text-align: center; }
  @media (orientation: portrait) { body.vr #rotate { display: flex; } }
  #toast { position: fixed; z-index: 6; left: 50%; bottom: 100px; transform: translateX(-50%); max-width: calc(100vw - 32px); width: max-content;
    padding: 10px 16px; border-radius: 12px; background: rgba(0,0,0,0.55); font-size: 14px; opacity: 0; transition: opacity 0.5s; pointer-events: none; }
  #toast.show { opacity: 1; } body.vr #toast { bottom: 30%; max-width: 40vw; left: 25%; }
  [hidden] { display: none !important; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
  <div id="menu" class="panel">
    <h1>Orbital Lounge</h1>
    <p class="sub">A glass-domed cinema 400 km above Earth</p>
    <button id="play" disabled>Play</button>
    <button id="vr" disabled>VR Mode</button>
    <button id="openSettings" disabled>Settings</button>
    <label class="btn">Load movie (MP4)<input type="file" id="videoFile" accept="video/*"></label>
    <p id="status" class="note"></p>
  </div>
  <div id="settings" class="panel" hidden>
    <h1>Settings</h1>
    <label class="row">Graphics quality <span id="qVal"></span><input type="range" id="setQ" min="0" max="2" step="1"></label>
    <label class="row">Mute ambience <input type="checkbox" id="setMute" style="float:right"></label>
    <label class="row">VR eye distance <span id="setIpdVal"></span><input type="range" id="setIpd" min="50" max="75"></label>
    <label class="row">VR field of view <span id="setFovVal"></span><input type="range" id="setFov" min="60" max="100"></label>
    <p class="note">No sound on iPhone? Check the silent switch.</p>
    <button id="back">Back</button>
  </div>
  <div id="hud" hidden>
    <button id="exit">✕</button><button id="mute">🔊</button><button id="playBtn">⏯</button>
    <button id="walk">Hold to walk</button>
  </div>
  <div id="divider"></div>
  <div id="rotate">Turn your phone sideways for VR mode</div>
  <div id="toast"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
